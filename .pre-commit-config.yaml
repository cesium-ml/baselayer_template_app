repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Sanity checks
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      # Checks based on file type
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      # Detect mistakes
      - id: debug-statements
      - id: detect-private-key
      # Automatic fixes
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        exclude: |
          (?x)^(
              uv.lock|
              pnpm-lock.yaml
          )$

        pass_filenames: true

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: >-
          sh -c '[ -x node_modules/.bin/eslint ] || { echo "ESLint not found: run pnpm install"; exit 1; };
          exec node_modules/.bin/eslint "$@"' eslint
        language: system
        files: ^static/js/.*\.[jt]sx?$
        types: [file]
        require_serial: true
      - id: tsc
        name: tsc
        entry: >-
          sh -c '[ -x node_modules/.bin/tsc ] || { echo "TypeScript not found: run pnpm install"; exit 1; };
          exec node_modules/.bin/tsc'
        language: system
        files: \.[jt]sx?$
        pass_filenames: false
